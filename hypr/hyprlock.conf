# ~/.config/hypr/hyprlock.conf

# --- HINTERGRUND ---
background {
    monitor =
    path = screenshot
    # Ein leichtes Abdunkeln des Screenshots, damit der Text besser lesbar ist
    color = rgba(0, 0, 0, 0.6)
    blur_passes = 3      # Etwas stärkerer Blur für den Premium-Look
    blur_size = 8
}

# --- PROFILBILD / ICON ---
image {
    monitor =
    # WICHTIG: Ändere den Pfad zu deinem gewünschten Bild (muss .png oder .jpg sein)
    path = ~/.config/hypr/avatar.png 
    size = 150
    rounding = -1        # -1 macht das Bild komplett rund (Kreis)
    border_size = 4
    border_color = rgba(255, 255, 255, 0.8)
    position = 0, 200
    halign = center
    valign = center
}

# --- UHRZEIT ---
label {
    monitor =
    text = $TIME
    color = rgba(255, 255, 255, 1.0)
    font_size = 90
    font_family = JetBrains Mono Nerd Font, sans-serif # Tausche die Schriftart nach Belieben aus
    position = 0, 20
    halign = center
    valign = center
    shadow_passes = 2
}

# --- DATUM & BEGRÜßUNG ---
label {
    monitor =
    # Zeigt den aktuellen Tag und das Datum auf Deutsch an
    text = cmd[update:18000000] echo "<b> "$(date +'%A, %d. %B')" </b>"
    color = rgba(200, 200, 200, 1.0)
    font_size = 22
    font_family = JetBrains Mono Nerd Font, sans-serif
    position = 0, -50
    halign = center
    valign = center
}

label {
    monitor =
    text = Willkommen zurück, $USER!
    color = rgba(255, 255, 255, 0.7)
    font_size = 14
    font_family = JetBrains Mono Nerd Font, sans-serif
    position = 0, -90
    halign = center
    valign = center
}

# --- PASSWORTEINGABE ---
input-field {
    monitor =
    size = 250, 55
    outline_thickness = 2
    dots_size = 0.2          # Größe der Passwort-Punkte
    dots_spacing = 0.2       # Abstand zwischen den Punkten
    dots_center = true
    outer_color = rgba(255, 255, 255, 0.1)  # Sehr dezenter, transparenter Rand
    inner_color = rgba(0, 0, 0, 0.4)        # Halbdurchsichtiger Hintergrund (Frosted)
    font_color = rgba(255, 255, 255, 0.9)
    fade_on_empty = true
    fade_timeout = 1000      # Feld verschwindet nach 1 Sekunde ohne Eingabe
    placeholder_text = <i>Passwort eingeben...</i>
    hide_input = false
    rounding = 15            # Leicht abgerundete Ecken (statt komplett rund)
    check_color = rgba(0, 255, 170, 0.8)    # Farbe ändert sich beim Überprüfen des Passworts (CachyOS-Türkis)
    fail_color = rgba(255, 60, 60, 0.8)     # Farbe bei falschem Passwort
    fail_text = <i>Falsches Passwort <b>($ATTEMPTS)</b></i>
    position = 0, -180
    halign = center
    valign = center
}
