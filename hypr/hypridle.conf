# hypridle – automatisches Sperren & Bildschirm aus
# Gestartet aus hyprland.lua (Autostart). Waybar-Icon (idle.sh) zeigt an, wenn hypridle NICHT läuft;
# Klick auf das Icon schaltet hypridle an/aus.
#
# Hinweis: Die Hyprland-Config ist Lua, daher erwartet "hyprctl dispatch" Lua-Ausdrücke
# (z.B. hl.dsp.dpms({ action = "off" })) statt der alten Syntax "dpms off".

general {
    lock_cmd = pidof hyprlock || hyprlock                                    # loginctl lock-session -> hyprlock
    before_sleep_cmd = loginctl lock-session                                 # vor Suspend sperren
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'      # nach Suspend Bildschirme an
}

# Nach 5 Minuten: sperren
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Nach 5,5 Minuten: Bildschirme aus (bei Aktivität wieder an)
listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}
